name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk YandexDownloader-Android-v1.0.2.apk
          sha256sum YandexDownloader-Android-v1.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YandexDownloader-Android-v1.0.2
          path: YandexDownloader-Android-v1.0.2.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish Android APK in Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.2
          name: Yandex Downloader v1.0.2 · Android
          target_commitish: \${{ github.sha }}
          body: |
            Test APK for Android 8.0+ ARM64, built with Android SDK and Chaquopy.
            This is a debug-signed APK for user testing, not a Google Play release.
            Downloads require the user’s own Yandex account and service permissions.
            Windows and Omarchy builds: v1.0.1.
          fail_on_unmatched_files: true
          files: YandexDownloader-Android-v1.0.2.apk
