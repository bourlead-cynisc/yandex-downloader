name: Build Windows and Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-24.04
            platform: Linux-Omarchy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libx11-6 libxext6 libxrender1 libxft2 libfontconfig1
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Smoke test desktop UI and liked collection button
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python - <<'PYTEST'
          from app import App
          from downloader import parse_link
          app = App()
          url = "https://music.yandex.ru/album/42389520/track/111124021"
          app.update()
          app.clipboard_clear()
          app.clipboard_append(url)
          app.update()
          app.paste_button.invoke()
          assert app.link.get() == url
          assert parse_link("https://music.yandex.ru/collection?type=liked").kind == "likes"
          assert app.likes_button.winfo_exists()
          app.destroy()
          print("Desktop UI and liked-playlist control passed")
          PYTEST
      - name: Build Windows .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name YandexDownloader --icon assets/icon.ico --add-data assets/icon.png:assets
          --collect-all customtkinter --collect-all keyring --collect-all mutagen app.py
      - name: Build Linux GUI
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name yandex-downloader --icon assets/icon.png --add-data assets/icon.png:assets \
            --collect-all customtkinter --collect-all keyring --collect-all mutagen \
            --collect-all secretstorage app.py
          mkdir -p release-linux
          cp -a dist/yandex-downloader release-linux/
          cp install-omarchy-binary.sh release-linux/
          cp assets/icon.png release-linux/
          tar -C release-linux -czf yandex-downloader-linux-omarchy-x86_64.tar.gz .
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: YandexDownloader-Windows-x64
          path: dist/YandexDownloader.exe
          if-no-files-found: error
      - name: Upload Omarchy artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yandex-downloader-Omarchy-Linux-x64
          path: yandex-downloader-linux-omarchy-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.4
          name: Yandex Downloader v1.0.4 (likes, tags, saved login)
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*