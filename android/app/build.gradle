plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.bourlead.yandexdownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bourlead.yandexdownloader'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.2'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'yandex-music==3.2.2'
            install 'requests==2.32.3'
        }
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}