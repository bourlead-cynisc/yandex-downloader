name: Smoke test supplied Yandex Music track

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-example-track.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate supplied URL and check service access without credentials
        env:
          TARGET_URL: "https://music.yandex.ru/album/42389520/track/111124021?utm_medium=copy_link&ref_id=232a7b69-a35f-4980-adb7-b809452b527e"
        run: |
          python - <<'PY'
          import os
          from downloader import parse_link, resolve_link, _pick_file
          from yandex_music import Client
          url = os.environ["TARGET_URL"]
          parsed = parse_link(url)
          assert parsed.kind == "track" and parsed.item_id == "111124021", parsed
          print("PASS URL: parsed as track 111124021")
          try:
              client = Client().init()
              print("Public client initialization: OK")
              title, tracks = resolve_link(client, parsed)
              print(f"Metadata: count={len(tracks)}")
              if not tracks:
                  print("RESULT: no public metadata; cannot test download without authorization")
              else:
                  item = tracks[0]
                  print(f"Track metadata: id={item.track_id}; title={item.title!r}; artist={item.artist!r}")
                  duration = getattr(item.track, "duration_ms", None)
                  print(f"Track nominal duration (ms): {duration}")
                  try:
                      mode, info, codec = _pick_file(client, item, "nq")
                      preview = getattr(info, "preview", None)
                      print(f"File info returned: mode={mode}; codec={codec}; preview={preview}")
                      print("RESULT: full-length audio NOT VERIFIED; no authenticated account")
                  except Exception as e:
                      print(f"File access blocked: {type(e).__name__}: {str(e)[:300]}")
                      print("RESULT: full-length audio requires authenticated entitlements")
          except Exception as e:
              print(f"Public-client error: {type(e).__name__}: {str(e)[:300]}")
              print("RESULT: full-length audio NOT VERIFIED; no authenticated account")
          PY
